<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAP 看板</title>
<style>
:root{color-scheme:dark;--bg:#0b131b;--card:#131f2a;--line:#23384a;--t:#e8f0f5;--m:#8ea3b3;
--grey:#5d6b78;--gold:#e0b44c;--green:#3fbf7f;--blue:#4a8fe0;--red:#e05656}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
header b{font-size:18px}header span{color:var(--m);font-size:12px}#age{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 20px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.k small{color:var(--m);font-size:12px}.k strong{display:block;font-size:22px;margin-top:2px}.k i{font-style:normal;color:var(--m);font-size:12px}
.pos{color:var(--green)}.neg{color:var(--red)}
.legend{display:flex;gap:14px;padding:0 20px 6px;color:var(--m);font-size:12px}
.legend em{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:8px 20px 24px}
.c{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:8px 10px;min-height:92px}
.c.done{border-left-color:var(--grey)}.c.push{border-left-color:var(--gold);background:#2a2412}.c.live{border-left-color:var(--green)}
.c.wait{border-left-color:var(--blue);opacity:.75}.c.bad{border-left-color:var(--red)}.c.off{border-left-color:#333;opacity:.45}
.h{display:flex;justify-content:space-between;align-items:baseline}.h b{font-size:14px}.h span{color:var(--m);font-size:12px}
.tag{font-size:11px;padding:0 5px;border-radius:4px;background:#22384a;color:#9cc;margin-left:4px}.tag.f{background:#3a2f12;color:var(--gold)}
.r{display:flex;justify-content:space-between;font-size:13px;margin-top:4px}.r span{color:var(--m)}
.d{margin-top:5px;font-size:13px;font-weight:600}.d.p{color:var(--gold)}.d.x{color:var(--m);font-weight:400}
.hit{font-size:11px}.hit.y{color:var(--green)}.hit.n{color:var(--red)}
@media(max-width:1100px){.grid,.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid,.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header><b>WAP 天气看板</b><span id="meta"></span><span id="age"></span></header>
<section class="kpis" id="kpis"></section>
<div class="legend"><span><em style="background:var(--blue)"></em>未开始</span><span><em style="background:var(--green)"></em>进行中</span><span><em style="background:var(--gold)"></em>已下单</span><span><em style="background:var(--grey)"></em>已结束</span><span><em style="background:var(--red)"></em>异常</span><span>时间=北京时间开窗(当地09:30)·档位=中心双档·实测=当日已观测最高</span></div>
<section class="grid" id="grid"></section>
<script src="./board.js?v=1"></script>
</body></html>
